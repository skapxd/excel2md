name: CI/CD

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

# Token de GITHUB con el mínimo privilegio por defecto.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # pnpm@11 requiere Node >= 22.13 (usa node:sqlite); por eso no se prueba en 20.x.
        node-version: [22.x, 24.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'

    # pnpm no ejecuta build scripts de dependencias por defecto (ver
    # pnpm-workspace.yaml), así que el install es seguro frente a PRs no confiables.
    - name: Install dependencies (Frozen Lockfile)
      run: pnpm install --frozen-lockfile

    - name: Type Check
      run: pnpm typecheck

    # - name: Run Tests
    #   run: pnpm test

  publish:
    name: Publish to NPM
    needs: build-and-test
    # Solo publica cuando se empuja un tag tipo v1.2.3 (no en push a main ni en PRs).
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js for Publishing
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      # Evita publicar si el tag (vX.Y.Z) no coincide con la versión de package.json.
      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::El tag $GITHUB_REF_NAME no coincide con la versión de package.json ($PKG_VERSION)"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Package
        run: pnpm build

      - name: Publish to NPM
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
